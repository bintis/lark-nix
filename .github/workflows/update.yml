name: update

on:
  schedule:
    # Daily at 06:00 UTC (14:00 Beijing, 02:00 New York).
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: lark-nix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Run update.sh
        run: bash update.sh

      # Pushes made with GITHUB_TOKEN don't trigger the build workflow, so
      # build here: a bump that doesn't build is never committed, and a good
      # one gets pushed to Cachix by cachix-action.
      - name: Build lark if changed
        run: |
          if git diff --quiet lark.nix; then
            echo "No changes, skipping build."
            exit 0
          fi
          nix build .#lark --print-build-logs
          nix path-info -Sh .#lark

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet lark.nix; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(grep -oE 'version = "[^"]+"' lark.nix | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lark.nix
          git commit -m "lark: bump to $version"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
